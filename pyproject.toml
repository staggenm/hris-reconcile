[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hris-reconcile"
version = "0.3.0"
description = "A deterministic reconciliation engine for HR system landscapes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hris-reconcile contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pyinstaller>=6,<7",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
    "types-PyYAML>=6",
]

[project.scripts]
hris-reconcile = "hris_reconcile.cli:app"
hris-reconcile-ui = "hris_reconcile.ui.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hris_reconcile"]

[tool.hatch.build]
include = [
    "src/hris_reconcile/**/*.py",
    "src/hris_reconcile/ui/static/*",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hris_reconcile"]
mypy_path = "src"
