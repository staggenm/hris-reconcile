name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Rebuilds and requires the fresh build to equal the committed dist/hris-reconcile.html.
      - run: npm run verify:ci
        env:
          CI: "true"
      - name: Checksum
        working-directory: dist
        run: sha256sum hris-reconcile.html > hris-reconcile.html.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hris-reconcile.html dist/hris-reconcile.html.sha256 \
            --title "HRIS Reconciliation $GITHUB_REF_NAME" \
            --notes "Standalone workbench. Verify the download with: sha256sum -c hris-reconcile.html.sha256"
